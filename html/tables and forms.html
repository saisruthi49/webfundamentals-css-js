<!DOCTYPE html>
<html>
    <head>
        <body>
            <<table border="1">
  <caption>Student Marks</caption>
  <thead>
    <tr>
      <th>Name</th>
      <th>Subject</th>
      <th>Marks</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Sruthi</td>
      <td>Maths</td>
      <td>90</td>
    </tr>
    <tr>
      <td>Anil</td>
      <td>Science</td>
      <td>85</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td colspan="2">Total students</td>
      <td>2</td>
    </tr>
  </tfoot>
</table>


Tag	Meaning
<table>	The whole table
<caption>	Title of the table
<thead>	Header section
<tbody>	Main data section
<tfoot>	Footer section (totals)
<tr>	Table row
<th>	Header cell (bold and centred by default)
<td>	Data cell





        </body>
    </head>
</html>
